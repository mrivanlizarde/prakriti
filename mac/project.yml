# Prakriti for Mac. This file is the source of truth for the Xcode project.
# After changing it, regenerate:  cd ~/Code/prakriti/mac && xcodegen generate
# The generated Prakriti.xcodeproj is committed too, so a fresh clone builds without xcodegen.

name: Prakriti
options:
  bundleIdPrefix: studio.therowan.prakriti
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Signed with Ivan's Apple Development certificate from the first build. macOS ties folder
    # permission to the code signature; an ad-hoc build gets a new identity on every rebuild and
    # silently loses the permission while System Settings still shows it ticked (SCOPE 7.17).
    DEVELOPMENT_TEAM: LD587PB2H8
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    # A warning is a failed build. "Builds clean" is the milestone check, so the compiler enforces it.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: NO

# Swift packages, each pinned to an exact version and fetched only after Ivan's yes (docs/v2/PLAN.md
# section 11). swift-markdown 0.9.0 (21 Sep 2026) parses the Help articles (v2 part M2a); the exact
# versions it brings with it (swift-cmark and others) are pinned in Package.resolved, committed.
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  # FluidAudio 0.15.5 (revision 19600a4, 7 Jul 2026): the offline speaker diarizer for a recording with one mixed
  # track (v2 part M6b). Pinned to exactly the version Hark's Package.resolved records (PLAN section 11, Ivan's yes).
  # Its models are read from ~/Library/Application Support/FluidAudio/Models/speaker-diarization, already on this
  # Mac, with FluidAudio's offline mode on, so it never downloads anything (People/Diarizer.swift).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5

targets:
  Prakriti:
    type: application
    platform: macOS
    sources:
      - path: Prakriti
        excludes:
          - Resources/Help
      # The Help articles (v2 part M2a), copied into the app as one folder, Contents/Resources/Help,
      # so the bundle holds exactly the files in mac/Prakriti/Resources/Help and nothing flattens.
      - path: Prakriti/Resources/Help
        type: folder
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Prakriti
        PRODUCT_BUNDLE_IDENTIFIER: studio.therowan.prakriti.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No App Sandbox: Prakriti runs ffmpeg and Parakeet and reads Ivan's folders directly.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Prakriti/Resources/Prakriti.entitlements
    info:
      path: Prakriti/Resources/Info.plist
      properties:
        CFBundleDisplayName: Prakriti
        CFBundleName: Prakriti
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "The Rowan Studio"
        # macOS may quit an app with no open windows on its own. Prakriti must keep running with
        # its window closed, so automatic and sudden termination are both off.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSDocumentsFolderUsageDescription: "Prakriti reads new recordings in the folders you choose so it can prepare them for review."
        NSDesktopFolderUsageDescription: "Prakriti reads new recordings in the folders you choose so it can prepare them for review."
        NSDownloadsFolderUsageDescription: "Prakriti reads new recordings in the folders you choose so it can prepare them for review."
        NSNetworkVolumesUsageDescription: "Prakriti reads new recordings on the studio drive so it can prepare them for review."
        NSRemovableVolumesUsageDescription: "Prakriti reads new recordings on the archive drive so it can prepare them for review."
    scheme:
      testTargets:
        - PrakritiTests
      gatherCoverageData: false

  PrakritiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PrakritiTests
    dependencies:
      - target: Prakriti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.therowan.prakriti.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prakriti.app/Contents/MacOS/Prakriti"
        BUNDLE_LOADER: "$(TEST_HOST)"
